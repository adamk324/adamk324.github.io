        // Make both windows draggable by their own title bars and center them by default
        function makeDraggable(windowEl, titleBarEl) {
            let isDragging = false, offsetX = 0, offsetY = 0;

            titleBarEl.style.cursor = "move";
            windowEl.style.position = "absolute";

            function onMouseMove(e) {
                if (isDragging) {
                    windowEl.style.left = `${e.clientX - offsetX}px`;
                    windowEl.style.top = `${e.clientY - offsetY}px`;
                }
            }

            function onMouseUp() {
                isDragging = false;
                document.body.style.userSelect = "";
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            }

            titleBarEl.addEventListener('mousedown', function(e) {
                // Only start drag if clicking directly on the title bar, not on its children
                if (e.target !== titleBarEl) return;

                const rect = windowEl.getBoundingClientRect();
                windowEl.style.transform = "";
                windowEl.style.left = rect.left + window.scrollX + "px";
                windowEl.style.top = rect.top + window.scrollY + "px";

                isDragging = true;
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
                document.body.style.userSelect = "none";
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });
        }

    <script>
const steamId = "76561199141123828";
const apiUrl = `https://steamcommunity.com/profiles/${steamId}/games?tab=all&xml=1`;

async function fetchGames() {
    // Use a CORS proxy since Steam blocks direct browser requests
    const proxy = "https://corsproxy.io/?";
    const resp = await fetch(proxy + encodeURIComponent(apiUrl));
    const xml = await resp.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(xml, "text/xml");
    const games = [...doc.querySelectorAll("game")].map(game => ({
        name: game.querySelector("name").textContent,
        appid: game.querySelector("appID").textContent
    }));
    return games;
}

function getGameImgUrl(appid) {
    // Steam header image pattern
    return `https://cdn.cloudflare.steamstatic.com/steam/apps/${appid}/header.jpg`;
}

async function startSlideshow() {
    const box = document.getElementById("image-box");
    const img = document.getElementById("game-img");
    const title = document.getElementById("game-title");
    let games = [];
    try {
        games = await fetchGames();
    } catch {
        title.textContent = "Could not load games";
        return;
    }
    if (!games.length) {
        title.textContent = "No games found";
        return;
    }
    let idx = 0;
    function showGame(i) {
        title.textContent = games[i].name;
        img.src = getGameImgUrl(games[i].appid);
        img.style.display = "block";
    }
    showGame(idx);
    setInterval(() => {
        idx = (idx + 1) % games.length;
        showGame(idx);
    }, 2500);
}
startSlideshow();
</script>
